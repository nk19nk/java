<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
</head>
<body>
<h1>Orders</h1>
<a href="/orders/new">Add New Order</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Restaurant ID</th>
        <th>Order Date</th>
        <th>Total Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.restaurantId}"></td>
        <td th:text="${order.orderDate}"></td>
        <td th:text="${order.totalPrice}"></td>
        <td>
            <a th:href="@{'/orders/edit/' + ${order.id}}">Edit</a>
            <form th:action="@{'/orders/delete/' + ${order.id}}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
