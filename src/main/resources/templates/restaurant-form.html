<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Restaurant</title>
</head>
<body>
<h1 th:text="${#strings.isEmpty(restaurant.id) ? 'Add New Restaurant' : 'Edit Restaurant'}"></h1>
<form th:object="${restaurant}" th:action="@{'/restaurants/save'}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required><br>
    <label for="address">Address:</label>
    <input type="text" id="address" th:field="*{address}"><br>
    <label for="dateOfFoundation">Date of Foundation:</label>
    <input type="date" id="dateOfFoundation" th:field="*{dateOfFoundation}" required><br>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" th:field="*{phone}"><br>
    <label for="openingTime">Opening Time:</label>
    <input type="time" id="openingTime" th:field="*{openingTime}"><br>
    <label for="closingTime">Closing Time:</label>
    <input type="time" id="closingTime" th:field="*{closingTime}"><br>
    <label for="rating">Rating:</label>
    <input type="number" id="rating" step="0.1" th:field="*{rating}"><br>
    <button type="submit">Save</button>
</form>
</body>
</html>
