<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Order</title>
</head>
<body>
<h1 th:text="${#strings.isEmpty(order.id) ? 'Add New Order' : 'Edit Order'}"></h1>
<form th:object="${order}" th:action="@{'/orders/save'}" method="post">
    <label for="restaurantId">Restaurant ID:</label>
    <input type="number" id="restaurantId" th:field="*{restaurantId}" required><br>
    <label for="totalPrice">Total Price:</label>
    <input type="number" id="totalPrice" step="0.01" th:field="*{totalPrice}" required><br>
    <button type="submit">Save</button>
</form>
</body>
</html>
